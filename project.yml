name: Seal
options:
  createIntermediateGroups: true
  # ⚠️ 最低支持 = iOS 17.4（2026-09-24 用户指令：「16.0-17.3.1 禁止使用」）。
  #    17.4 是 Apple 引入 `CoreDeviceProxy`（远程配对）的那一版 ⇒ 这是**唯一**一条
  #    不依赖本机配对 / 免 VPN 的安装链路。部署目标共 **9 处**必须同步：
  #    本文件 5 处（这里 + 4 个 target）+ `Config/Base.xcconfig` 1 处
  #    + 三份 workflow 各 1 处硬编码断言（`ios.yml` / `ios-fast.yml` / `ios-release.yml`）。
  #    ⚠️ 漏改 workflow 断言 ⇒ `build-package` 直接红；守卫 R69 已钉住一致性。
  #    ⚠️ 配对助手的「< 17.4 ⇒ Lockdown」分流**刻意保留**（Lockdown 代码不删）。
  deploymentTarget:
    iOS: "17.4"
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    exactVersion: 0.9.20
  AltSign:
    # Seal carries targeted AltSign protocol fixes under `upstream/AltSign`.
    # Building the remote pinned revision silently excludes those fixes even
    # though their paths trigger CI, so this must be a local package source.
    path: upstream/AltSign
  AnisetteKit:
    # ⚠️ **改成 vendor 路径**（2026-09-19）—— 原因见 `Vendor/SideSign/Package.swift` 的注释：
    # `SideSign` 声明的是 `branch: "main"`，与这里原来的固定 revision 冲突 ⇒ SwiftPM 解析失败 ✗。
    # 上游自己在注释里就是用本地路径的 ✓。原 revision：`081200ec0cfcecc1fd7ef0dd8c5ddc62bd040c88`
    path: Vendor/AnisetteKit
  SideSign:
    # ★ **上游（SideStore）的重签层** —— 它内部调用 `CodeSignKit` 完成真正的签名 ✓
    # 依赖也全部 vendor 到 `Vendor/`（见 `Vendor/SideSign/Package.swift` ✓）
    path: Vendor/SideSign
  Crypto:
    url: https://github.com/apple/swift-crypto
    exactVersion: 4.5.2
  Minimuxer:
    path: Vendor/Minimuxer
  # ⚠️ **`RorkSign` 已移除**（2026-09-19）—— 签名器换成了上游 SideStore 的
  # `SideSign` + `CodeSignKit` ✓（用户死命令：「签名器不一样你就换」✓）。
  # `Vendor/rork-sign` 目录也已删除 ✓。
targets:
  Seal:
    type: application
    platform: iOS
    deploymentTarget: "17.4"
    sources:
      - path: Seal
        excludes:
          - "Resources/Anisette/*.so"
      # 与 Live Activity 扩展共享的属性定义。放在 `Shared/` 而不是 `Seal/` 下，
      # 是为了将来启用扩展时两个 target 都能引用同一个文件、且扩展不必用 `../` 跨出仓库根。
      - path: Shared
    resources:
      - path: Seal/Resources/Anisette
    dependencies:
      - package: ZIPFoundation
      - package: AltSign
        product: AltSign-Static
      - package: AnisetteKit
      - package: Minimuxer
      - package: SideSign
        product: SideSign
      - package: Crypto
        product: Crypto
      - package: Crypto
        product: CryptoExtras
      - target: DeviceSupport
      # ⚠️ **Live Activity 扩展刻意未嵌入**（2026-10-16）。
      #
      # 现状：`SealLiveActivity` target 连同界面都已写好，但**没有**挂到这里。
      # 原因不是写不出来，而是三道各自独立的阻碍：
      #
      # 1. `Scripts/verify-ipa.sh` 有一条**刻意**的发布闸门：
      #      if grep -q '^Payload/Seal.app/PlugIns/' ...
      #        echo "Unexpected app extension found in Seal IPA (no-extension build expected)"
      #    它从初始快照 (`db52641`) 就在，是「Seal 的 IPA 不带扩展」这个设计的一部分，
      #    不该为了一个 UI 功能顺手拆掉。
      # 2. 该扩展在模拟器上装不上（两轮 `Invalid placeholder attributes`，见 DEBUG_LOG）。
      #    项目此前没有任何同类扩展的成功实例，属于首次引入。
      # 3. 免费 Apple ID 每周只有 10 个 App ID，扩展要多占 1 个（AltStore 官方文档）。
      #
      # 功能本身没有因此缺失：配对码改走**本地通知**（`PairingCodeNotification`），
      # 同样浮在「设置」上方、同样点一下回到 Seal，且不依赖扩展、不占 App ID。
      # 要启用灵动岛时，把下面这行取消注释，并同步放开 `verify-ipa.sh` 的扩展闸门。
      # - target: SealLiveActivity
      #   embed: true
    info:
      path: Seal/Resources/Info.plist
      properties:
        CFBundleDisplayName: Seal
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        SealOriginalBundleIdentifier: com.mjorb.seal
        CFBundleURLTypes:
          - CFBundleURLName: com.mjorb.seal
            CFBundleURLSchemes:
              - seal
              - sidestore
        CFBundleDocumentTypes:
          - CFBundleTypeName: IPA Archive
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes:
              - com.apple.itunes.ipa
              - public.zip-archive
              - public.data
        LSSupportsOpeningDocumentsInPlace: true
        UIFileSharingEnabled: true
        # 后台保活（「不打开 App 的后台自动续签」三层里的第 ① 层）。
        # 🔴 `audio + location`：`BackgroundKeepAliveService`（静音音频）＋
        #    `LocationKeepAliveService`（后台定位）双保险。音频会被来电/闹钟/路由变更/媒体重置
        #    打断，自愈之间有窗口；后台定位是 iOS 上仅次于 VoIP 的持久保活，与音频的失效模式正交。
        #    上游 SideStore 自己也声明 `location`（有备选 BackgroundLocationService）；
        #    Locus / StikDebug 等依赖 LocalDevVPN 的同类 App 同样 `audio + location`。
        #    ⚠️ `location` 首次会弹定位权限（用户点「始终允许」后无需再干预）。
        # ⚠️ **仍不加 `fetch`** —— 那是「系统自己找机会刷」那条路（需要
        #    `UIApplicationDelegate.performFetchWithCompletionHandler`），本项目**还没有**
        #    AppDelegate；声明了却不处理只会让系统白唤醒、并让排查时误以为有这条路径。
        #    要加时**两件事一起做**（声明 ＋ 处理回调）。`processing` 同理（需 BGTaskScheduler）。
        # ⚠️ `UIBackgroundModes` 是 **Info.plist 键、不是 entitlement** ⇒ 侧载签名拿得到
        #    （上游 SideStore 自己就是侧载 App，一直用它）。
        UIBackgroundModes:
          - audio
          - location
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.apple.itunes.ipa
            UTTypeDescription: iOS App Archive
            UTTypeConformsTo:
              - public.zip-archive
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - ipa
              public.mime-type:
                - application/octet-stream
                - application/x-itunes-ipa
        ITSAppUsesNonExemptEncryption: false
        NSLocalNetworkUsageDescription: Seal 使用本地网络发布设备配对服务，并连接此设备安装应用。
        # 后台定位保活（`LocationKeepAliveService`）用。⚠️ 缺 `AlwaysAndWhenInUse` 这一项，
        # `requestAlwaysAuthorization()` 会直接崩溃（权限描述缺失 = iOS 强制终止）。
        NSLocationWhenInUseUsageDescription: Seal 需要定位权限在后台保持活跃，以便不打开 App 也能自动续签应用。
        NSLocationAlwaysAndWhenInUseUsageDescription: Seal 需要「始终允许」定位，在锁屏 / 后台时保持活跃，完成自动续签。
        # 🔴 浏览 Bonjour 服务**必须**声明服务类型（iOS 14+）。缺了它 `NWBrowser`
        #    不报错、只是**永远没有结果** —— 端口自愈会静默失效，日志上也看不出来。
        #    这里只列 `RemotePairingPortDiscovery` 真正会浏览的三个
        #    （`RemotePairingPortPolicy.serviceTypes`；守卫 R95 钉住两边一致）。
        NSBonjourServices:
          - _remotepairing._tcp
          - _remotepairing-pairable-host._tcp
          - _remotepairing-manual-pairing._tcp
        NSPhotoLibraryAddUsageDescription: Seal 需要访问相册以保存赞赏码图片。
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # ⚠️ 这里**刻意没有** `NSSupportsLiveActivities`。
        # 它只有在真正嵌入 Live Activity 扩展时才有意义；本期扩展未嵌入
        # （原因见 `targets.Seal.dependencies` 里的说明），声明了反而会让系统
        # 以为 Seal 支持实时活动却永远等不到活动。启用扩展时和那一行一起加回来。
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mjorb.seal
        PRODUCT_NAME: Seal
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 3
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Seal/Resources/Seal.entitlements
        # Xcode 16+ Debug 构建默认把代码拆进 <Name>.debug.dylib（预览调试用）。
        # 侧载分发场景第三方签名工具常漏签根目录 dylib → 白图标+秒闪退。关闭之。
        ENABLE_DEBUG_DYLIB: NO
  DeviceSupport:
    type: library.static
    platform: iOS
    deploymentTarget: "17.4"
    dependencies:
      - package: AltSign
        product: OpenSSL
    sources:
      - path: Vendor/DeviceSupport/libimobiledevice/src
      - path: Vendor/DeviceSupport/libimobiledevice/common
      - path: Vendor/DeviceSupport/libimobiledevice-glue/src
      - path: Vendor/DeviceSupport/libplist/src
      - path: Vendor/DeviceSupport/libplist/libcnary
      - path: Vendor/DeviceSupport/libusbmuxd/src/libusbmuxd.c
    settings:
      base:
        PRODUCT_NAME: imobiledevice
        EXECUTABLE_PREFIX: lib
        SKIP_INSTALL: YES
        GCC_C_LANGUAGE_STANDARD: gnu11
        CLANG_CXX_LANGUAGE_STANDARD: c++14
        GCC_ENABLE_CPP_EXCEPTIONS: YES
        GCC_ENABLE_CPP_RTTI: YES
        GCC_WARN_INHIBIT_ALL_WARNINGS: YES
        GCC_PREPROCESSOR_DEFINITIONS:
          - $(inherited)
          - HAVE_CONFIG_H=1
          - HAVE_OPENSSL=1
          - HAVE_STPNCPY=1
          - HAVE_STPCPY=1
          - HAVE_VASPRINTF=1
          - HAVE_ASPRINTF=1
          - HAVE_GETIFADDRS=1
          - HAVE_STRNDUP=1
        HEADER_SEARCH_PATHS:
          - $(PROJECT_DIR)/Vendor/DeviceSupport
          - $(PROJECT_DIR)/Vendor/DeviceSupport/libplist/include
          - $(PROJECT_DIR)/Vendor/DeviceSupport/libplist/src
          - $(PROJECT_DIR)/Vendor/DeviceSupport/libplist/libcnary/include
          - $(PROJECT_DIR)/Vendor/DeviceSupport/libimobiledevice
          - $(PROJECT_DIR)/Vendor/DeviceSupport/libimobiledevice/include
          - $(PROJECT_DIR)/Vendor/DeviceSupport/libimobiledevice/src
          - $(PROJECT_DIR)/Vendor/DeviceSupport/libusbmuxd/include
          - $(PROJECT_DIR)/Vendor/DeviceSupport/libimobiledevice-glue/include
  SealTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.4"
    sources:
      - path: SealTests
    dependencies:
      - target: Seal
      - package: ZIPFoundation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mjorb.seal.tests
        GENERATE_INFOPLIST_FILE: YES
  SealUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.4"
    sources:
      - path: SealUITests
    dependencies:
      - target: Seal
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mjorb.seal.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Seal:
    build:
      targets:
        Seal: all
        SealTests: [test]
        SealUITests: [test]
    test:
      gatherCoverageData: true
      targets:
        - SealTests
        - SealUITests
